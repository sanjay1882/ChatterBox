
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register & Login - Chatterbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="firebaseauth.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <!-- Logo Header - Outside Container -->
    <div class="logo-header">
        <i class='bx bx-doughnut-chart'></i>
        <h1>Chatterbox</h1>
    </div>

    <!-- Sign In Form -->
    <div class="container active" id="signIn">
        <h1 class="form-title">Sign In</h1>
        <form method="post" action="">
            <div id="signInMessage" class="messageDiv" style="display:none;"></div>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
            <p class="recover">
                <a href="#">Recover Password</a>
            </p>
            <button class="btn" id="submitSignIn">Sign In</button>
        </form>
        <p class="or">
            ------------- or -------------
        </p>
        <div class="icons">
            <i class="fab fa-google" id="googleSignInBtn"></i>
            <i class='bx bxs-phone' id="phone-auth"></i>
        </div>
        <div class="links">
            <p>Don't have account yet?</p>
            <button id="signUpButton">Sign Up</button>
        </div>
    </div>

    <!-- Sign Up Form -->
    <div class="container" id="signup">
        <h1 class="form-title">Register</h1>
        <form method="post" action="">
            <div id="signUpMessage" class="messageDiv" style="display:none;"></div>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="fName" placeholder="First Name" required>
                <label for="fName">First Name</label>
            </div>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="lName" placeholder="Last Name" required>
                <label for="lName">Last Name</label>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="rEmail" placeholder="Email" required>
                <label for="rEmail">Email</label>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="rPassword" placeholder="Password" required>
                <label for="rPassword">Password</label>
            </div>
            <button class="btn" id="submitSignUp">Sign Up</button>
        </form>
        <p class="or">
            ----------or--------
        </p>
        <div class="links">
            <p>Already Have Account?</p>
            <button id="signInButton">Sign In</button>
        </div>
    </div>

    <!-- Phone Verification Form -->
    <div class="container" id="number-verify">
        <h1 class="form-title">Sign In with Phone</h1>
        <form method="post" action="">
            <div id="phoneMessage" class="messageDiv" style="display:none;"></div>
            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="tel" id="phone-number" placeholder="+91 1234567890" required>
                <label for="phone-number">Mobile Number</label>
            </div>
            <p style="color: #ccc; text-align: center; margin-bottom: 20px; font-size: 14px;">
                Enter your phone number with country code
            </p>
            <button class="btn" id="submitNumber">Send OTP</button>
        </form>
        <p class="or">
            ------------- or -------------
        </p>
        <div class="icons">
            <i class="fab fa-google" id="googleSignInBtn2"></i>
        </div>
        <div class="links">
            <button id="backToSignIn">Back to Sign In</button>
        </div>
        
        <div id="recaptcha-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
