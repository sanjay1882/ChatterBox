<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Chat - Treevit</title>
    <link rel="icon" href="assests/Designer.png" type="image/png">
    <!-- Updated CSS link to point to chat/index.css -->
    <link rel="stylesheet" href="chat/index.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.3/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Damion&family=Hind+Madurai:wght@300;400;500;600;700&family=Playwrite+VN:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        .sidebar {
            display: none !important;
        }

        .show-chatbot {
            width: 100%;
            left: 0;
        }

        li {
            color: #fff;
        }

        .chatbot {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .shared-footer-container {
            position: fixed;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 100;
            height: 60px;
        }

        .shared-footer {
            position: relative;

            border-radius: 40px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 85%;
            max-width: 750px;
            min-height: 80px;

            transition: all 0.3s ease;
            margin: auto;
        }

        .shared-footer::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 40px;
            padding: 1.1px;

            background-size: 300% 300%;
            animation: borderGlow 4s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            pointer-events: none;
        }

        .shared-footer a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 20px 20px;
            border-radius: 40px;
            background: linear-gradient(135deg, #673ab7, #512da8);
            transition: transform 0.2s;
            font-size: 0.9rem;

        }

        .shared-footer a:hover {
            transform: scale(1.05);
        }

        .shared-info {
            color: #BBBBBB;
            font-size: 0.9rem;
            margin-right: 10px;
        }

        body.white-mode .shared-footer {
            background: #e3f2fd;
        }

        body.white-mode .shared-info {
            color: #333;
        }

        .chatbox .incoming p h1,
        .chatbox .incoming p h2,
        .chatbox .incoming p h3,
        .chatbox .incoming p h4,
        .chatbox .incoming p h5,
        .chatbox .incoming p h6 {
            margin: 16px 0 12px 0;
            line-height: 1.3;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <section class="show-chatbot">
        <div class="chatbot">
            <header>
                <div class="left-header" style="display: flex; align-items: center; padding-left: 15px;">
                    <i class='bx bx-doughnut-chart' style="color:white; font-size: 24px; margin-right: 10px;"></i>

                    <h2 id="chat-title" style="font-family: 'Poppins', sans-serif; font-size: 1.6rem;">Treevit</h2>
                </div>
                <div class="center-header">

                    <h2>Treevit</h2>
                </div>
                <div class="right-heder-bar">
                    <i class='bx bxs-sun' id="darkmodebtn"></i>
                </div>
            </header>

            <div class="chatbox" id="chatbox">
                <div id="loading" style="text-align: center; margin-top: 50px; color: var(--text-color);">Loading shared
                    session...</div>
            </div>

            <div class="shared-footer-container">
                <div class="shared-footer">

                    <a href="index.html">Start Your Own Chat</a>
                </div>
            </div>
        </div>
    </section>

    <script type="module">
        import { API_BASE_URL } from './config.js';

        document.getElementById('darkmodebtn').addEventListener('click', function () {
            document.body.classList.toggle('white-mode');
        });

        function formatStreamedText(text) {

            // Think block extraction
            const thinkBlocks = [];
            let processedText = text.replace(/<think>([\s\S]*?)<\/think>/g, (match, content) => {
                thinkBlocks.push(content);
                return `__THINK_BLOCK_${thinkBlocks.length - 1}__`;
            });

            const openThinkMatch = processedText.match(/<think>([\s\S]*)$/);
            if (openThinkMatch) {
                const content = openThinkMatch[1];
                thinkBlocks.push(content);
                processedText = processedText.replace(/<think>([\s\S]*)$/, `__THINK_BLOCK_${thinkBlocks.length - 1}__`);
            }

            // Math block extraction
            const mathBlocks = [];
            processedText = processedText.replace(/\$\$([\s\S]*?)\$\$/g, (match, content) => {
                mathBlocks.push({ content: content, display: true });
                return `__MATH_BLOCK_${mathBlocks.length - 1}__`;
            });

            processedText = processedText.replace(/\$([^$\n]+?)\$/g, (match, content) => {
                mathBlocks.push({ content: content, display: false });
                return `__MATH_INLINE_${mathBlocks.length - 1}__`;
            });

            const escapeHTML = (str) =>
                String(str).replace(/[&<>"']/g, (tag) => (
                    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[tag]
                ));

            function createTableHTMLFromLines(rows) {
                if (!rows || !rows.length) return '';

                const parse = (r) => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());

                const header = parse(rows[0]);
                let alignments = new Array(header.length).fill(null);

                if (rows.length > 1) {
                    const divider = rows[1].replace(/\s+/g, '');
                    if (/^[:\-|]+$/.test(divider)) {
                        const divCells = parse(rows[1]);
                        alignments = divCells.map(cell => {
                            const left = cell.startsWith(':');
                            const right = cell.endsWith(':');
                            if (left && right) return 'center';
                            if (right) return 'right';
                            if (left) return 'left';
                            return null;
                        });
                    }
                }

                let html = '<br><table class="md-table"><thead><tr>';
                for (let i = 0; i < header.length; i++) {
                    const align = alignments[i] ? ` style="text-align:${alignments[i]}"` : '';
                    html += `<th${align}>${header[i] || ''}</th>`;
                }
                html += '</tr></thead><tbody>';

                for (let r = 1; r < rows.length; r++) {
                    const cells = parse(rows[r]);
                    html += '<tr>';
                    for (let i = 0; i < header.length; i++) {
                        const cell = (cells[i] !== undefined) ? cells[i] : '';
                        const align = alignments[i] ? ` style="text-align:${alignments[i]}"` : '';
                        html += `<td${align}>${cell}</td>`;
                    }
                    html += '</tr>';
                }

                html += '</tbody></table><br>';
                return html;
            }

            processedText = escapeHTML(processedText)
                .replace(/(\p{Emoji_Presentation}|\p{Extended_Pictographic})/gu, '<span class="emoji-reset">$1</span>')
                .replace(/^[-*_]{3,}\s*$/gm, '') // Remove horizontal rules
                .replace(/^###### (.*$)/gim, '<h6>$1</h6>\n')
                .replace(/^##### (.*$)/gim, '<h5>$1</h5>\n')
                .replace(/^#### (.*$)/gim, '<h4>$1</h4>\n')
                .replace(/^### (.*$)/gim, '<h3>$1</h3>\n')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>\n')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>\n')
                .replace(/\*\*\*(.*?)\*\*\*/gim, '<b><i>$1</i></b>')
                .replace(/\*\*(.*?)\*\*/gim, '<b>$1</b>')
                .replace(/\*(.*?)\*/gim, '<i>$1</i>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2" target="_blank" class="styled-link"><i class="bx bx-link"></i> $1</a>')
                .replace(/`([^`]+)`/gim, '<code>$1</code>')
                .replace(/```(\w+)?\n?([\s\S]*?)```/gim, (match, lang, code) => {
                    const language = lang ? ` class="language-${lang}"` : '';
                    return `<pre><code${language}>${code}</code></pre>`;
                })
                .replace(/^\s*[-*]\s+(.*)/gim, '<li>$1</li>');

            const lines = processedText.split('\n');
            let html = '';
            let inList = false;
            let inTable = false;
            let tableLines = [];

            for (let line of lines) {
                const trimmed = line.trim();

                const pipeCount = (line.match(/\|/g) || []).length;
                const looksLikeTableRow = pipeCount >= 2 && !/^<pre><code>/.test(line) && !/<\/code><\/pre>/.test(line);

                if (looksLikeTableRow) {
                    inTable = true;
                    tableLines.push(line);
                    continue;
                }

                if (inTable && tableLines.length) {
                    html += createTableHTMLFromLines(tableLines);
                    tableLines = [];
                    inTable = false;
                }

                if (line.match(/<li>/)) {
                    if (!inList) {
                        html += '<ul id="list-unstyled">';
                        inList = true;
                    }
                    html += line;
                    continue;
                } else {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                }

                if (line.match(/<h[1-6]>/)) {
                    html += `${line}<br>`;
                    continue;
                }

                if (line.match(/^<pre><code>/)) {
                    html += `${line}\n`;
                    continue;
                }

                if (trimmed) {
                    html += `<p style="background:rgba(255,255,255,0);">${line}</p>`;
                } else {
                    html += `<br>`;
                }
            }

            if (inTable && tableLines.length) {
                html += createTableHTMLFromLines(tableLines);
            }

            if (inList) html += '</ul>';

            // Restore Think Blocks
            html = html.replace(/__THINK_BLOCK_(\d+)__/g, (match, index) => {
                const content = thinkBlocks[index];
                return `<div class="think-block-wrapper">
                    <details class="think-block-details">
                        <summary>Thought Process</summary>
                        <div class="think-block-content">${content}</div>
                    </details>
                </div>`;
            });

            // Restore Math Blocks
            html = html.replace(/__MATH_BLOCK_(\d+)__/g, (match, index) => {
                const block = mathBlocks[index];
                if (!block) return match;
                try {
                    return katex.renderToString(block.content, {
                        displayMode: true,
                        throwOnError: false
                    });
                } catch (e) {
                    return match;
                }
            });

            html = html.replace(/__MATH_INLINE_(\d+)__/g, (match, index) => {
                const block = mathBlocks[index];
                if (!block) return match;
                try {
                    return katex.renderToString(block.content, {
                        displayMode: false,
                        throwOnError: false
                    });
                } catch (e) {
                    return match;
                }
            });

            return html;
        }

        async function loadSharedSession() {

            document.body.style.visibility = 'visible';
            document.body.style.overflow = 'auto';

            const urlParams = new URLSearchParams(window.location.search);
            const shareId = urlParams.get('id');

            if (!shareId) {
                document.getElementById('loading').textContent = "Invalid share link.";
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/shared/${shareId}`);
                if (!res.ok) throw new Error("Session not found");

                const session = await res.json();

                document.getElementById('loading').style.display = 'none';

                const chatbox = document.getElementById('chatbox');

                session.messages.forEach(msg => {
                    const li = document.createElement("li");
                    li.classList.add("chat", msg.role === "user" ? "outgoing" : "incoming");

                    let text = "";
                    if (msg.parts) {
                        text = msg.parts.find(p => !p.text.startsWith("System-Time") && !p.text.startsWith("Web-Scraped-Data"))?.text || msg.parts[0].text;
                    }

                    if (msg.role === "user") {
                        // User message rendering
                        const messageID = "msg_" + Math.random().toString(36).substr(2, 9);
                        li.innerHTML = `<p id="${messageID}" class="user-message">${text}</p>`;
                    } else {
                        // Model message rendering
                        const messageID = "msg_" + Math.random().toString(36).substr(2, 9);
                        li.innerHTML = `<p id="${messageID}" class="chat-content">${formatStreamedText(text)}</p>`;
                    }
                    chatbox.appendChild(li);
                });

            } catch (error) {
                document.getElementById('loading').textContent = "Failed to load shared session.";
                console.error(error);
            }
        }

        loadSharedSession();
    </script>
</body>

</html>
