<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Chatterbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="firebaseauth.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>

    <!-- ── Sign In ─────────────────────────────────────── -->
    <div class="auth-page container active" id="signIn">

        <div class="auth-logo">
            <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
                <rect width="40" height="40" rx="10" fill="#141414" />
                <path d="M12 20L17 25L28 14" stroke="white" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <span>Chatterbox</span>
        </div>

        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in to your account</p>

        <div id="signInMessage" class="messageDiv"></div>

        <form method="post" action="" class="auth-form">
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                <a href="#" class="field-link">Forgot password?</a>
            </div>
            <button class="btn-primary" id="submitSignIn" type="submit">Continue</button>
        </form>

        <div class="divider"><span>or</span></div>

        <div class="social-btns">
            <button class="btn-social" id="googleSignInBtn">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4"
                        d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" />
                    <path fill="#34A853"
                        d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" />
                    <path fill="#FBBC05"
                        d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332Z" />
                    <path fill="#EA4335"
                        d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 6.294C4.672 4.169 6.656 3.58 9 3.58Z" />
                </svg>
                Continue with Google
            </button>
            <button class="btn-social" id="phone-auth">
                <i class='bx bxs-phone'></i>
                Continue with Phone
            </button>
        </div>

        <p class="auth-switch">
            Don't have an account?
            <button id="signUpButton" class="link-btn">Sign up</button>
        </p>
    </div>


    <!-- ── Sign Up ─────────────────────────────────────── -->
    <div class="auth-page container" id="signup">

        <div class="auth-logo">
            <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
                <rect width="40" height="40" rx="10" fill="#141414" />
                <path d="M12 20L17 25L28 14" stroke="white" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <span>Chatterbox</span>
        </div>

        <h1 class="auth-title">Create account</h1>
        <p class="auth-sub">Get started for free</p>

        <div id="signUpMessage" class="messageDiv"></div>

        <form method="post" action="" class="auth-form">
            <div class="field-row">
                <div class="field">
                    <label for="fName">First name</label>
                    <input type="text" id="fName" placeholder="Jane" required>
                </div>
                <div class="field">
                    <label for="lName">Last name</label>
                    <input type="text" id="lName" placeholder="Doe" required>
                </div>
            </div>
            <div class="field">
                <label for="rEmail">Email address</label>
                <input type="email" id="rEmail" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="field">
                <label for="rPassword">Password</label>
                <input type="password" id="rPassword" placeholder="Min. 8 characters" required
                    autocomplete="new-password">
            </div>
            <button class="btn-primary" id="submitSignUp" type="submit">Create account</button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <button id="signInButton" class="link-btn">Sign in</button>
        </p>
    </div>


    <!-- ── Phone Auth ──────────────────────────────────── -->
    <div class="auth-page container" id="number-verify">
        <div id="phone-input-section">

            <div class="auth-logo">
                <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="10" fill="#141414" />
                    <path d="M12 20L17 25L28 14" stroke="white" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span>Chatterbox</span>
            </div>

            <h1 class="auth-title">Phone sign-in</h1>
            <p class="auth-sub">We'll send a one-time code</p>

            <div id="phoneMessage" class="messageDiv"></div>

            <form method="post" action="" class="auth-form">
                <div class="field">
                    <label for="phone-number">Mobile number</label>
                    <input type="tel" id="phone-number" placeholder="+91 98765 43210" required>
                </div>
                <button class="btn-primary" id="submitNumber" type="submit">Send OTP</button>
            </form>

            <div class="divider"><span>or</span></div>
            <div class="social-btns">
                <button class="btn-social" id="googleSignInBtn2">
                    <svg width="18" height="18" viewBox="0 0 18 18">
                        <path fill="#4285F4"
                            d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" />
                        <path fill="#34A853"
                            d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" />
                        <path fill="#FBBC05"
                            d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332Z" />
                        <path fill="#EA4335"
                            d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 6.294C4.672 4.169 6.656 3.58 9 3.58Z" />
                    </svg>
                    Continue with Google
                </button>
            </div>

            <p class="auth-switch">
                <button id="backToSignIn" class="link-btn">← Back to Sign In</button>
            </p>
        </div>

        <div id="otp-verify-section" style="display:none;">
            <div class="auth-logo">
                <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="10" fill="#141414" />
                    <path d="M12 20L17 25L28 14" stroke="white" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span>Chatterbox</span>
            </div>
            <h1 class="auth-title">Enter OTP</h1>
            <p class="auth-sub" id="otp-sent-text">Code sent to your number</p>

            <div id="otpMessage" class="messageDiv"></div>

            <form method="post" action="" class="auth-form">
                <div class="field">
                    <label for="otp-code">6-digit code</label>
                    <input type="text" id="otp-code" placeholder="000000" required maxlength="6" inputmode="numeric">
                </div>
                <button class="btn-primary" id="verifyOtp" type="submit">Verify</button>
            </form>

            <div class="auth-switch" style="margin-top:16px; text-align:center;">
                <button id="resendOtp" class="link-btn">Resend code</button>
                &nbsp;·&nbsp;
                <button id="backToPhone" class="link-btn">Change number</button>
            </div>
        </div>
        <div id="recaptcha-container"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
